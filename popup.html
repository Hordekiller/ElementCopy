<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elementor Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">Elementor Extractor</p>
          <h1 data-i18n="heroTitle"></h1>
        </div>
        <span id="statusBadge" class="badge" data-i18n="statusReady"></span>
      </header>

      <section class="actions">
        <button id="scanButton" class="primary" type="button" data-i18n="btnScanPage"></button>
        <button id="downloadElementorButton" type="button" data-i18n="btnDownloadElementor" disabled></button>
        <button id="downloadReportButton" type="button" data-i18n="btnDownloadReport" disabled></button>
        <button id="copyButton" type="button" data-i18n="btnCopy" disabled></button>
      </section>

      <section id="message" class="message" hidden></section>

      <section class="stats" data-i18n-aria-label="statsAria">
        <article>
          <strong id="totalNodes">0</strong>
          <span data-i18n="statElements"></span>
        </article>
        <article>
          <strong id="widgetCount">0</strong>
          <span data-i18n="statWidgets"></span>
        </article>
        <article>
          <strong id="imageCount">0</strong>
          <span data-i18n="statImages"></span>
        </article>
        <article>
          <strong id="linkCount">0</strong>
          <span data-i18n="statLinks"></span>
        </article>
      </section>

      <section class="result">
        <div class="result-header">
          <h2 data-i18n="outputTitle"></h2>
          <span id="siteInfo" data-i18n="notScanned"></span>
        </div>
        <textarea id="output" spellcheck="false" data-i18n-placeholder="outputPlaceholder"></textarea>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
