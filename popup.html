<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elementor Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">Elementor Extractor</p>
          <h1 data-i18n="heroTitle"></h1>
        </div>
        <span id="statusBadge" class="badge" data-i18n="statusReady"></span>
      </header>

      <section class="scope" aria-live="polite">
        <span class="scope-label" data-i18n="scopeLabel"></span>
        <span id="scopeValue" class="scope-value" data-i18n="scopePage"></span>
        <button id="clearSelectionButton" class="link-button" type="button" data-i18n="btnClearSelection" hidden></button>
      </section>

      <section class="actions">
        <button id="scanButton" class="primary" type="button" data-i18n="btnScanPage"></button>
        <button id="pickButton" type="button" data-i18n="btnPick"></button>
        <button id="downloadElementorButton" type="button" data-i18n="btnDownloadElementor" disabled></button>
        <button id="downloadReportButton" type="button" data-i18n="btnDownloadReport" disabled></button>
        <button id="copyButton" class="wide" type="button" data-i18n="btnCopy" disabled></button>
      </section>

      <section id="message" class="message" hidden></section>

      <section class="stats" data-i18n-aria-label="statsAria">
        <article>
          <strong id="totalNodes">0</strong>
          <span data-i18n="statElements"></span>
        </article>
        <article>
          <strong id="widgetCount">0</strong>
          <span data-i18n="statWidgets"></span>
        </article>
        <article>
          <strong id="imageCount">0</strong>
          <span data-i18n="statImages"></span>
        </article>
        <article>
          <strong id="linkCount">0</strong>
          <span data-i18n="statLinks"></span>
        </article>
      </section>

      <section class="result">
        <div class="result-header">
          <div class="tabs" role="tablist">
            <button id="tabTree" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="treeView" data-i18n="tabStructure"></button>
            <button id="tabJson" class="tab" type="button" role="tab" aria-selected="false" aria-controls="output" data-i18n="tabJson"></button>
          </div>
          <span id="siteInfo" data-i18n="notScanned"></span>
        </div>
        <div id="treeView" class="tree" role="tabpanel">
          <p class="tree-empty" data-i18n="outputPlaceholder"></p>
        </div>
        <textarea id="output" role="tabpanel" spellcheck="false" data-i18n-placeholder="outputPlaceholder" hidden></textarea>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
